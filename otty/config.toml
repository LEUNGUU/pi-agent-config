# Window/card theme. `paper-card` is our own theme (otty/themes/paper-card.ottytheme,
# installed to ~/.config/otty/themes/ by setup.sh): Floating Card with the paper
# background applied to [terminal], [panel] and [container]. The flat colour keys
# below only reach the terminal grid — the card itself is [container].background,
# which only a theme can set, which is why plain `background = ...` left it white.
theme = "paper-card"

theme-dark = "Nord"
foreground = "#1a1b18"
background = "#F0E4C2"
palette-0 = "#24292e"
# quit-after-last-window-closed = true (reset to default)

# selection-foreground = "#fafaff" (reset to default)
# cursor-text = "#565656" (reset to default)

font-size = 16

font-family = "Maple Mono NF CN"

copy-on-select = true

clipboard-trim-trailing-spaces = true

mouse-hide-while-typing = true

dock-icon-animate-progress = true

details-panel-width = 218

palette-1 = "#d73a49"
palette-2 = "#28a745"
palette-3 = "#dbab09"
palette-4 = "#0366d6"
palette-5 = "#5a32a3"
palette-6 = "#0598bc"
palette-7 = "#d4d6d7"
palette-8 = "#959da5"
palette-9 = "#cb2431"
palette-10 = "#22863a"
palette-11 = "#b08800"
palette-12 = "#005cc5"
palette-13 = "#5a32a3"
palette-14 = "#3192aa"

# font-blending = "linear" (reset to default)

palette-15 = "#d1d5da"

selection-background = "#4a6640"
cursor-color = "#18181b"

notification-foreground = "tab-unfocused"

window-layout = "tabs-top"

auto-hide-tab-bar = "auto"
